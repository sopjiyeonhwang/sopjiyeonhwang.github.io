<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dr. Jiyeon Hwang — Site Direction Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #1a1a1a; font-family: 'Inter', sans-serif; }
  * { box-sizing: border-box; }
  /* artboard-scoped resets so canvas chrome doesn't leak */
  .ab { color: #1a1a1a; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="artboards/direction-a.jsx"></script>
<script type="text/babel" src="artboards/direction-b.jsx"></script>
<script type="text/babel" src="artboards/direction-c.jsx"></script>
<script type="text/babel" src="artboards/notes-panel.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas title="Dr. Jiyeon Hwang — Soprano · Site Direction Explorations">
        <DCSection id="intro" title="Brief & approach">
          <DCArtboard id="notes" label="Project notes & CMS options" width={1200} height={760}>
            <NotesPanel />
          </DCArtboard>
        </DCSection>

        <DCSection id="homepages" title="Homepage — three directions">
          <DCArtboard id="dir-a" label="A — Classic Editorial" width={1440} height={1800}>
            <DirectionA />
          </DCArtboard>
          <DCArtboard id="dir-b" label="B — Modern Minimal" width={1440} height={1800}>
            <DirectionB />
          </DCArtboard>
          <DCArtboard id="dir-c" label="C — Cinematic" width={1440} height={1800}>
            <DirectionC />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
