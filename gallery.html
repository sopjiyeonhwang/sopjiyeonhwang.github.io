<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gallery — Dr. Jiyeon Hwang</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
<style>
  .event-block { padding: 56px 0; border-bottom: 1px solid var(--c-gold-soft); }
  .event-block:last-of-type { border-bottom: 0; }
  .event-head {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 48px;
    align-items: baseline;
    margin-bottom: 32px;
  }
  .event-date {
    font-family: var(--f-serif);
    font-style: italic;
    font-size: 28px;
    line-height: 1.1;
  }
  .event-date .year {
    display: block;
    font-family: var(--f-sans);
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--c-gold);
    margin-top: 4px;
  }
  .event-name {
    font-family: var(--f-serif);
    font-size: clamp(32px, 4vw, 44px);
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .event-venue {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--c-gold);
    margin-top: 10px;
  }
  .event-desc {
    font-family: var(--f-serif);
    font-style: italic;
    font-size: 18px;
    color: var(--c-ink-soft);
    margin: 14px 0 0;
    max-width: 580px;
    line-height: 1.5;
  }
  @media (max-width: 720px) {
    .event-head { grid-template-columns: 1fr; gap: 8px; }
  }
</style>
</head>
<body data-page="gallery">

<div data-site-header></div>

<main>
  <section class="page page-header">
    <div class="eyebrow">Photographs</div>
    <h1 class="serif">Gallery</h1>
    <hr class="rule center" />
    <p class="lede">Performance stills, portraits, and behind-the-scenes — organized by event, most recent first.</p>
  </section>

  <section class="page" style="padding-bottom: 96px;">
    <div data-events></div>
  </section>

  <section class="page" style="padding-bottom: 96px;">
    <div class="section-head">
      <h2 class="serif">From Instagram</h2>
      <a class="link" href="https://instagram.com/" target="_blank" rel="noopener" data-ig-link>@jiyeonhwang →</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;" data-ig-feed></div>
    <p style="font-size: 12px; color: var(--c-mute); margin-top: 24px; font-style: italic; text-align: center;">
      To enable a live Instagram feed, configure an embed provider in <code style="font-family: var(--f-mono);">content/gallery.json</code> — placeholders shown below.
    </p>
  </section>
</main>

<div data-site-footer></div>

<script src="assets/site.js"></script>
<script>
(async () => {
  const g = await Site.loadJSON('content/gallery.json');
  if (!g) return;

  // Sort events most-recent first
  const events = (g.events || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const host = document.querySelector('[data-events]');
  host.innerHTML = events.map(ev => {
    const d = new Date(ev.date);
    const dateStr = isNaN(d) ? (ev.date || '') : d.toLocaleDateString('en-US', { month: 'long', day: '2-digit' });
    const yearStr = isNaN(d) ? '' : String(d.getFullYear());
    const tiles = (ev.images || []).map(img => `
      <div class="tile ${img.size || 'w4 h-md'}">
        <div class="imgslot" style="width: 100%; height: 100%; min-height: 0;">
          ${img.src ? `<img src="${img.src}" alt="${img.alt || ''}" />` : `<span class="tag">${img.alt || 'PHOTO'}</span>`}
        </div>
      </div>
    `).join('');
    return `
      <div class="event-block">
        <div class="event-head">
          <div class="event-date">${dateStr}<span class="year">${yearStr}</span></div>
          <div>
            <h2 class="event-name">${ev.name}</h2>
            ${ev.venue ? `<div class="event-venue">${ev.venue}</div>` : ''}
            ${ev.description ? `<p class="event-desc">${ev.description}</p>` : ''}
          </div>
        </div>
        <div class="gallery-grid">${tiles}</div>
      </div>
    `;
  }).join('');

  // Instagram placeholder grid
  const ig = document.querySelector('[data-ig-feed]');
  if (ig) {
    ig.innerHTML = Array.from({ length: 6 }).map((_, i) => `
      <div class="imgslot" style="aspect-ratio: 1 / 1; min-height: 0;">
        <span class="tag">IG · @${g.instagram_handle || 'jiyeonhwang'} · ${String(i + 1).padStart(2, '0')}</span>
      </div>
    `).join('');
  }
  if (g.instagram_handle) {
    const a = document.querySelector('[data-ig-link]');
    if (a) {
      a.textContent = `@${g.instagram_handle} →`;
      a.href = `https://instagram.com/${g.instagram_handle}`;
    }
  }
})();
</script>
</body>
</html>
