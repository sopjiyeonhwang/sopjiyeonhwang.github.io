<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Students — Dr. Jiyeon Hwang</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/styles.css" />
</head>
<body data-page="students">

<div data-site-header></div>

<main>
  <section class="page page-header">
    <div class="eyebrow">Studio Highlights</div>
    <h1 class="serif">Student <span class="italic">achievements</span></h1>
    <hr class="rule center" />
    <p class="lede">Awards, competitions, and graduate school admissions from current and former students of Dr. Hwang's studio.</p>
  </section>

  <section class="page" style="padding-bottom: 96px;">
    <div data-achievements></div>
  </section>
</main>

<div data-site-footer></div>

<script src="assets/site.js"></script>
<script>
(async () => {
  const t = await Site.loadJSON('content/students.json');
  if (!t) return;
  const ach = (t.student_achievements || []).slice().sort((a,b) => String(b.year).localeCompare(String(a.year)));
  const byYear = {};
  ach.forEach(a => { (byYear[a.year] = byYear[a.year] || []).push(a); });
  const years = Object.keys(byYear).sort((a,b) => b.localeCompare(a));
  document.querySelector('[data-achievements]').innerHTML = years.map(y => `
    <div class="year-row">
      <div class="serif italic" style="font-size: 36px; color: var(--c-gold); line-height: 1;">${y}</div>
      <div>
        ${byYear[y].map(a => `
          <div class="student-row">
            <div class="serif" style="font-size: 20px; font-weight: 500;">${a.student}</div>
            <div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--c-ink); font-weight: 500;">${a.achievement}</div>
            <div style="font-size: 13px; color: var(--c-mute);">${a.context}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
})();
</script>
</body>
</html>
